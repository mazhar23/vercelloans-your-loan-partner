<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VercelLoans — Fast Personal Loans for U.S. Residents</title>
    <meta name="description" content="Apply online for fast, transparent personal loans up to $35,000. Quick decisions, fixed rates, funds delivered to your bank." />
    <!-- Suppress favicon -->
    <link rel="icon" href="data:," />
    <script>
      (function () {
        try {
          var t = "__ls_probe__";
          window.localStorage.setItem(t, t);
          window.localStorage.removeItem(t);
        } catch (e) {
          var mem = {};
          var shim = {
            getItem: function (k) {
              return Object.prototype.hasOwnProperty.call(mem, k) ? mem[k] : null;
            },
            setItem: function (k, v) {
              mem[k] = String(v);
            },
            removeItem: function (k) {
              delete mem[k];
            },
            clear: function () {
              mem = {};
            },
            key: function (i) {
              var keys = Object.keys(mem);
              return i < keys.length ? keys[i] : null;
            },
          };
          Object.defineProperty(shim, "length", {
            get: function () {
              return Object.keys(mem).length;
            },
          });
          var install = function (prop) {
            var ok = false;
            try {
              Object.defineProperty(window, prop, { value: shim, configurable: true });
              ok = true;
            } catch (e2) {}
            if (!ok) {
              try {
                Object.defineProperty(Object.getPrototypeOf(window), prop, {
                  value: shim,
                  configurable: true,
                });
                ok = true;
              } catch (e3) {}
            }
            if (!ok) {
              try {
                window[prop] = shim;
              } catch (e4) {}
            }
          };
          install("localStorage");
          install("sessionStorage");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
